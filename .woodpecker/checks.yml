# Repris de six-de-chaque (.woodpecker/checks.yml). Les tests de bout en bout sont dans e2e.yml.
# Chaque niveau de content/levels doit être valide et résolu par le solveur.
# Node : l'image officielle node:26 via le proxy Harbor.
labels:
  host: tank01

when:
  - event: push
    branch: main
  - event: [pull_request, manual]

steps:
  - name: npm ci
    image: &node harbor.pingfr.duckdns.org/dockerhub/library/node:26
    pull: true
    commands:
      - node --version
      - npm ci
  - name: lint
    image: *node
    commands:
      - npm run lint
  - name: typecheck
    image: *node
    commands:
      - npm run typecheck
  - name: test
    image: *node
    commands:
      - npm test
  - name: level:validate
    image: *node
    commands:
      - npm run level:validate -- content/levels
  - name: build
    image: *node
    commands:
      - npm run build
      - sha256sum dist/index.html
      - echo "empreinte dist $(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-64)"
  - name: check:precache
    image: *node
    commands:
      - npm run check:precache
  - name: audit
    image: *node
    commands:
      - npm audit --audit-level=high
  - name: secrets
    image: harbor.pingfr.duckdns.org/dockerhub/zricethezav/gitleaks:v8.30.1
    commands:
      - gitleaks detect --source . --no-banner --redact
